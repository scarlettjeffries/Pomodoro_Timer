<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Pomodoro Study Timer</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <h1>Pomodoro Study Timer</h1>
    <p>The Pomodoro method involves 25 minutes of work followed by 5 minute breaks. Each hour of work is then followed by a longer break. Use this timer to be more productive!</p>
    
    <div id="timer-options">
      <button id="studybutton">Study</button>
      <button id="shortbreak">Short Break</button>
      <button id="longbreak">Long Break</button>
    </div>

    <div id="timer-display">
      <button id="startbutton">Start</button>
      <button id="resetbutton">Reset</button>
    </div>

    <div id="customization">
      <button id="changebg">Change Background</button>
      <button id="settings">Settings</button>
    </div>

    <h2>Happy Studying!</h2>

    <script src="interactivity.js"></script>
  
  </body>
</html>
