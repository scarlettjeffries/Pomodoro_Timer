<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Pomodoro Study Timer</title>
  </head>

  <body>
    <h1>Pomodoro Study Timer</h1>
    <p>The Pomodoro method involves 25 minutes of work followed by 5 minute breaks. Each hour of work is then followed by a longer break. Use this timer to be more productive!</p>
    
    <div id="Timer-Options">
      <button>Study</button>
      <button>Short Break</button>
      <button>Long Break</button>
    </div>

    <div id="Timer-Display">
      <button>Start</button>
      <button>Reset</button>
    </div>

    <div id="Customization">
      <button>Settings</button>
      <h2>Happy Studying!</h2>
    </div>
  
  </body>
</html>
